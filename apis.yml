x-coverage:
  state: covered
  detail: >-
    Electra.aero publishes no developer program, but STEP 0b contract discovery found a
    live, anonymous, CORS-open JSON API on the provider's own host - the Statamic content
    surface at https://electra.aero/api serving 124 newsroom entries - which is captured
    here as a probe-derived OpenAPI 3.1 rather than recorded as "no API surface".
  evidence:
    - url: https://electra.aero/api/collections/news/entries
      status: 200
    - url: https://electra.aero/openapi.json
      status: 404
    - url: https://electra.aero/.well-known/agent-card.json
      status: 404
  checked: '2026-08-12'
x-enrichment-notes: >-
  Pointers deliberately NOT emitted, because the underlying thing does not exist and a
  pointer would assert that it does - WellKnown and SecurityTxt (all eight /.well-known/
  paths 404), AgentCard (agent-card.json and agent.json both 404), MCPServer (no server
  published; mcp/ holds a candidate projection only), SDKs (no package on any registry),
  StatusPage (status.electra.aero NXDOMAIN), Deprecation (no policy), Security and
  VulnerabilityDisclosure (no security.txt, no disclosure page), Compliance and TrustCenter
  (no published certifications), Idempotency (read-only surface, no idempotency contract),
  ChangeLog (the newsroom is corporate news, not a dated API changelog), AsyncAPI and
  Webhooks (no event surface), Pricing, SignUp, TermsOfService, PrivacyPolicy,
  DeveloperPortal, Documentation, APIReference, GettingStarted, Roadmap, Sandbox, CLI,
  Postman and GitHubOrganization (none published - see x-coverage). The
  github.com/Electra-Aero organization does exist but has zero public repositories, no
  public members and no verification, so it is recorded here rather than wired as a
  GitHubOrganization pointer.
