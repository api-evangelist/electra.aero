    Public, unauthenticated, CORS-open JSON API serving the Electra.aero newsroom — press
    releases, program milestones and syndicated coverage. This is the default Statamic
    Content REST API behind the corporate site; Electra neither documents nor supports it.
    Discovered and verified by probe on 2026-08-12 (124 entries, HTTP 200 anonymous). Only
    the `news` collection is exposed; every other Statamic resource returns 404.
