aid: electra.aero
name: Electra.aero
description: >-
  Electra is an American aerospace manufacturer developing hybrid-electric "Ultra Short"
  aircraft that combine blown lift with hybrid-electric propulsion to take off and land in
  roughly 150 feet, removing the runway from regional air travel. Founded in 2020 by Dr.
  John Langford, the founder of Aurora Flight Sciences, with MIT professors John Hansman
  and Mark Drela as technical advisors, Electra flew its EL2 Goldfinch technology
  demonstrator in November 2023 and submitted an FAA Part 23 type-certification
  application for the nine-passenger EL9 Ultra Short in December 2025. The company reports
  more than 2,200 pre-orders from over 60 operators, and works both a commercial regional
  air-mobility market and a defense last-tactical-leg airlift market backed by U.S. Air
  Force SBIR Phase III and STTR contracts. It is headquartered in Manassas, Virginia, with
  operations in Cambridge, Massachusetts and Switzerland and a production facility under
  development at AirPark Ohio adjacent to Springfield-Beckley Municipal Airport. Strategic
  investors include Lockheed Martin Ventures, Honeywell and Safran. Electra publishes no
  developer program, API reference or machine-readable specification; the one public,
  anonymous JSON API it serves is the Statamic CMS content surface behind its newsroom,
  discovered and documented here by probe.
